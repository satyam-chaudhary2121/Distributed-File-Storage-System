# Distributed File Storage configuration.
# Every key can be overridden by an environment variable DFS_<KEY_IN_UPPERCASE>,
# e.g. DFS_REPLICATION_FACTOR=2. Sections are for readability only.

coordinator:
  coordinator_host: 127.0.0.1
  coordinator_port: 8000
  database_path: data/coordinator/metadata.db
  temp_dir: data/coordinator/tmp
  # cluster_secret is deliberately NOT set here: provide DFS_CLUSTER_SECRET
  # (see .env.example). A development default is used when unset.

data:
  chunk_size: 1048576          # 1 MiB
  replication_factor: 3
  write_quorum: 2              # verified copies per chunk needed to commit an upload
  max_upload_size: 1073741824  # 1 GiB
  max_payload_size: 67108864   # 64 MiB, max TCP frame payload (>= chunk_size)
  virtual_nodes: 64            # vnodes per physical node; pinned after first start

health:
  heartbeat_interval: 2.0
  health_check_interval: 2.0
  suspect_timeout: 6.0
  failure_timeout: 15.0

recovery:
  recovery_interval: 5.0
  recovery_max_attempts: 5
  recovery_backoff_base: 1.0
  recovery_backoff_max: 60.0
  orphan_grace_seconds: 300
  reconcile_verify_data: true

network:
  connect_timeout: 3.0
  io_timeout: 30.0
  client_retries: 2
  node_max_connections: 64
  node_idle_timeout: 60.0

node:
  node_host: 127.0.0.1
  node_capacity_bytes: 10737418240  # 10 GiB

log_level: INFO
